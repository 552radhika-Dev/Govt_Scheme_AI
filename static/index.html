<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haqdarshak · Citizen Scheme Assistant</title>
  <meta name="description" content="Haqdarshak Citizen Welfare FAQ Assistant: Grounded bilingual assistance for central and state schemes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <div class="brand-badge">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">Haqdarshak <span class="badge-tag">Scheme Assistant</span></h1>
          <p class="brand-subtitle">Official Welfare Entitlement Guidance</p>
        </div>
      </div>
    </div>

    <div class="header-center">
      <div class="scheme-selector-wrap">
        <label for="schemeSelect" class="selector-label">Current Scheme:</label>
        <select id="schemeSelect" class="scheme-dropdown">
          <option value="SCHEME-CENTRAL-PMK-001">PM-KISAN (Pradhan Mantri Kisan Samman Nidhi)</option>
          <option value="SCHEME-STATE-MAH-MLB-002">Mukhyamantri Majhi Ladki Bahin Yojana</option>
        </select>
      </div>
    </div>

    <div class="header-right">
      <!-- Language Selector -->
      <div class="segmented-control" id="langToggle">
        <button type="button" class="segment-btn active" data-lang="en">EN English</button>
        <button type="button" class="segment-btn" data-lang="hi">हिंदी Hindi</button>
      </div>

      <!-- Low-Literacy Easy Mode Toggle -->
      <button type="button" class="pill-toggle" id="modeToggle" title="Toggle simple, easy-to-read answers with bullet points">
        <span class="pill-icon">🌱</span>
        <span id="modeText">Simple Mode</span>
      </button>

      <!-- Toggle Scheme Record Sidebar -->
      <button type="button" class="action-btn" id="toggleSidebarBtn" title="View official scheme record">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span id="sidebarBtnText">Scheme Details</span>
      </button>
    </div>
  </header>

  <!-- Clean 2-Column Interface -->
  <main class="main-layout" id="mainLayout">
    
    <!-- Left Column: Official Scheme Record (Field Format) -->
    <aside class="panel panel-scheme" id="schemeSidebar">
      <div class="panel-header">
        <div class="panel-header-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <h2>Official Scheme Record</h2>
        </div>
        <span class="meta-pill" id="schemeMetaPill">Approved</span>
      </div>

      <div class="scheme-details-card" id="schemeOverviewCard">
        <!-- Loaded dynamically -->
      </div>

      <div class="field-filter-bar">
        <span class="filter-label">Filter:</span>
        <div class="filter-chips">
          <button type="button" class="chip active" data-filter="all">All (<span id="countAll">0</span>)</button>
          <button type="button" class="chip" data-filter="found">Found (<span id="countFound">0</span>)</button>
          <button type="button" class="chip chip-warning" data-filter="not_found">Not Found (<span id="countNotFound">0</span>)</button>
        </div>
      </div>

      <div class="fields-container" id="fieldsList">
        <!-- 6-part SchemeField cards -->
      </div>
    </aside>

    <!-- Main Column: Citizen Assistant & Chat -->
    <section class="panel panel-chat">
      <!-- Top Preset FAQ Bar -->
      <div class="preset-faqs-section">
        <div class="section-micro-header">
          <span id="faqHeaderTitle">Frequently Asked Questions</span>
          <span class="text-muted" id="faqCountLabel">10 Questions</span>
        </div>
        <div class="faq-chip-scroll" id="faqPresets">
          <!-- Curated FAQ chips -->
        </div>
      </div>

      <!-- Chat Conversation Area -->
      <div class="chat-scroll" id="chatMessages">
        <!-- Messages -->
      </div>

      <!-- Chat Input Box -->
      <form class="chat-input-form" id="chatForm">
        <div class="input-wrapper">
          <input
            type="text"
            id="chatInput"
            class="chat-text-input"
            placeholder="Ask any question in English or Hindi (e.g., 'Am I eligible if...' / 'क्या मैं पात्र हूँ?')..."
            autocomplete="off"
            required
          >
          <button type="submit" class="send-btn" id="sendBtn" title="Send Question">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </form>
    </section>

  </main>

  <script src="/static/app.js"></script>
</body>
</html>
